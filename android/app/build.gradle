plugins { id 'com.android.application' }

// Número de versión: el número de corrida de GitHub Actions (así cada APK nuevo se instala encima del anterior)
def corrida = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'py.clima.app'
    compileSdk 34
    defaultConfig {
        applicationId 'py.clima.app'
        minSdk 24
        targetSdk 34
        versionCode corrida
        versionName "1.0.${corrida}"
    }
    // Firma: si el repositorio tiene los secretos ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS, el flujo los usa; si no, la
    // llave incluida en android/firma (pública: alcanza para instalar y actualizar la app a mano, no para publicarla en Play Store).
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: '../firma/clima-py.jks')
            storePassword System.getenv('KEYSTORE_PASS') ?: 'clima-py-publica'
            keyAlias 'clima-py'
            keyPassword System.getenv('KEYSTORE_PASS') ?: 'clima-py-publica'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
